<svg xmlns="http://www.w3.org/2000/svg" width="640" height="218" viewBox="0 0 640 218" role="img" aria-label="Terminal: the launcher finds claude-usage-widget 0.13.1, asks to upgrade, upgrades the venv and starts the widget in the background">
  <style>
    text { font-family: "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #7d8590; }
    .prompt { fill: #58a6ff; }
    .warn { fill: #e3b341; }
    .ok { fill: #3fb950; }
    .title { fill: #9198a1; font-size: 12px; }
  </style>
  <rect width="640" height="218" rx="10" fill="#161b22"/>
  <rect width="640" height="30" rx="10" fill="#21262d"/>
  <rect y="20" width="640" height="10" fill="#21262d"/>
  <circle cx="20" cy="15" r="6" fill="#f85149"/>
  <circle cx="40" cy="15" r="6" fill="#e3b341"/>
  <circle cx="60" cy="15" r="6" fill="#3fb950"/>
  <text x="320" y="19" text-anchor="middle" class="title">Konsole — ~/claude/github/berth</text>
  <text x="18" y="58"><tspan class="prompt">$</tspan> ./claude-usage.sh -d</text>
  <text x="18" y="80" class="warn">claude-usage-widget 0.13.1 is available (installed: 0.13.0).</text>
  <text x="18" y="102">Upgrade now? [y/N] y</text>
  <text x="18" y="124" class="dim">… (pip output trimmed)</text>
  <text x="18" y="146" class="dim">Downloading claude_usage_widget-0.13.1-py3-none-any.whl (179 kB)</text>
  <text x="18" y="168" class="ok">Successfully installed claude-usage-widget-0.13.1</text>
  <text x="18" y="190"><tspan class="prompt">$</tspan> <tspan class="dim"># widget now running; logs in ~/.cache/claude-usage/widget.log</tspan></text>
</svg>
